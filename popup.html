<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; padding: 15px; width: 300px; background-color: #f8f9fa; margin: 0; }
    h3 { margin-top: 0; color: #1a73e8; text-align: center; }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: #333; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 5px; transition: background-color 0.2s; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 13px; color: #555; white-space: pre-wrap; word-break: break-all; min-height: 40px; padding: 10px; background: white; border-radius: 4px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h3>RISS 논문 다운로더</h3>
  <div class="input-group">
    <label>검색 키워드</label>
    <input type="text" id="keyword" placeholder="예: 인공지능">
  </div>
  <div class="input-group">
    <label>다운로드 수</label>
    <input type="number" id="maxDownloads" value="3" min="1">
  </div>
  <button id="startBtn">자동 다운로드 시작</button>
  <div id="status">숭실대 포털을 통해 RISS에 먼저 접속하고 로그인한 상태에서 실행해주세요.</div>
  <script src="popup.js"></script>
</body>
</html>
